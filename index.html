<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>會議記錄助理</title>
<meta name="theme-color" content="#14161a" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="deck">

  <!-- ── 機身頂部：像錄音機的 LCD 顯示區 ───────────────────────── -->
  <header class="fascia">
    <div class="fascia__brand">
      <span class="fascia__dot" id="statusDot"></span>
      <span class="fascia__title">會議記錄助理</span>
      <button class="icon-btn" id="settingsBtn" aria-label="設定" title="設定">⚙</button>
    </div>

    <div class="lcd">
      <div class="lcd__time" id="elapsed">00:00</div>
      <div class="lcd__label" id="statusText">尚未開始錄音</div>
    </div>

    <!-- VU 音量表：分段 LED 風格，即時反映麥克風音量 -->
    <div class="vu" id="vu" aria-hidden="true">
      <div class="vu__seg" style="--i:0"></div>
      <div class="vu__seg" style="--i:1"></div>
      <div class="vu__seg" style="--i:2"></div>
      <div class="vu__seg" style="--i:3"></div>
      <div class="vu__seg" style="--i:4"></div>
      <div class="vu__seg" style="--i:5"></div>
      <div class="vu__seg" style="--i:6"></div>
      <div class="vu__seg" style="--i:7"></div>
      <div class="vu__seg" style="--i:8"></div>
      <div class="vu__seg" style="--i:9"></div>
      <div class="vu__seg" style="--i:10"></div>
      <div class="vu__seg" style="--i:11"></div>
    </div>
  </header>

  <!-- ── 額外指示 ─────────────────────────────────────────────── -->
  <div class="field">
    <label for="extraInput">額外指示（選填）</label>
    <input id="extraInput" type="text" placeholder="例如：這是採購會議，請特別列出報價與交期" />
  </div>

  <!-- ── 傳輸鍵區：像錄音機的按鍵列 ───────────────────────────── -->
  <div class="transport">
    <button class="rec-btn" id="recordBtn" aria-pressed="false">
      <span class="rec-btn__ring"></span>
      <span class="rec-btn__core"></span>
    </button>
    <div class="transport__label" id="recordLabel">按下開始錄音</div>
  </div>

  <div class="spinner-row" id="busyRow" hidden>
    <span class="spinner"></span>
    <span id="busyText">處理中…</span>
  </div>

  <!-- ── 用量面板：卷軸計數器風格 ─────────────────────────────── -->
  <section class="quota">
    <div class="quota__item">
      <div class="quota__head"><span>今日 RPD</span><span id="rpdNum">–/–</span></div>
      <div class="quota__bar"><div class="quota__fill" id="rpdFill"></div></div>
    </div>
    <div class="quota__item">
      <div class="quota__head"><span>本分鐘 RPM</span><span id="rpmNum">–/–</span></div>
      <div class="quota__bar"><div class="quota__fill" id="rpmFill"></div></div>
    </div>
    <div class="quota__item">
      <div class="quota__head"><span>本分鐘 TPM</span><span id="tpmNum">–/–</span></div>
      <div class="quota__bar"><div class="quota__fill" id="tpmFill"></div></div>
    </div>
  </section>

  <!-- ── 結果預覽 ─────────────────────────────────────────────── -->
  <section class="result" id="resultSection" hidden>
    <div class="result__toolbar">
      <span>會議記錄</span>
      <button class="pill-btn" id="saveBtn">💾 下載 / 分享</button>
    </div>
    <iframe class="result__frame" id="resultFrame" title="會議記錄預覽"></iframe>
  </section>

</div>

<!-- ── 設定面板（滑入式） ──────────────────────────────────────── -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden>
  <div class="sheet" role="dialog" aria-label="設定">
    <div class="sheet__grip"></div>
    <h2>設定</h2>

    <div class="field">
      <label for="workerUrl">Worker 端點網址</label>
      <input id="workerUrl" type="url" placeholder="https://your-worker.your-subdomain.workers.dev" />
      <p class="hint">處理音訊、呼叫 Gemini 的 Cloudflare Worker 網址（見 worker/ 資料夾）。</p>
    </div>

    <div class="field">
      <label for="modelSelect">模型</label>
      <select id="modelSelect">
        <option value="gemini-flash-latest">gemini-flash-latest（推薦，額度較高）</option>
        <option value="gemini-flash-lite-latest">gemini-flash-lite-latest（額度最高，品質較簡）</option>
        <option value="gemini-pro-latest">gemini-pro-latest（品質較好，額度較少）</option>
      </select>
    </div>

    <p class="hint">
      ⚠ Gemini API Key 不放在這裡——Key 設定在 Cloudflare Worker 的環境變數，
      手機端完全不會接觸到 Key，比較安全。
    </p>

    <div class="sheet__actions">
      <button class="pill-btn pill-btn--ghost" id="settingsCancel">取消</button>
      <button class="pill-btn" id="settingsSave">儲存</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
